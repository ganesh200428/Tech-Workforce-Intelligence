services:
  - type: web
    name: tech-workforce-intelligence
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: streamlit run src/dashboard/app.py --server.port $PORT --server.address 0.0.0.0
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
